name: Tests

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser and bridge tests
        run: npm test
      - name: Server tests
        working-directory: server
        run: npm test
