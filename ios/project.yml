# XcodeGen spec for the CookBook iPhone app. CI regenerates CookBook.xcodeproj
# from this file, so edit this file rather than the Xcode project's settings
# (except Signing & Capabilities > Team, which you set in Xcode).
name: CookBook
options:
  bundleIdPrefix: io.github.gr00gles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CookBook:
    type: application
    platform: iOS
    sources:
      - path: CookBook
      - path: ../cookbook/parser.js
        buildPhase: resources
      - path: ../cookbook/bridge.js
        buildPhase: resources
    info:
      path: CookBook/Info.plist
      properties:
        CFBundleDisplayName: CookBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CookBookServerURL: $(COOKBOOK_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gr00gles.cookbook
        # The server that holds recipes from Claude until the app collects them.
        # Set this to your own deployment (see server/README.md).
        COOKBOOK_SERVER_URL: https://cookbook-server.YOUR-ACCOUNT.workers.dev
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CookBookTests
  CookBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookBookTests
    dependencies:
      - target: CookBook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gr00gles.cookbook.tests
